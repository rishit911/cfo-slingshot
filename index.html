async function sendToSheets(report) {
    if (!SHEETS_URL || SHEETS_URL === "YOUR_APPS_SCRIPT_URL_HERE") return;
    const c = report.candidate || {};
    const row = {
        id:             report.id,
        fullName:       c.name        || "",
        age:            c.age         || "",
        gender:         c.gender      || "",
        email:          c.email       || "",
        currentStatus:  c.status      || "",
        ug:             c.ug          || "",
        pg:             c.pg          || "",
        completedAt:    report.completedAt ? new Date(report.completedAt).toLocaleString() : "",
        durationMin:    report.durationSeconds ? (report.durationSeconds / 60).toFixed(1) : "",
        fitIndex:       report.fitIndex ?? "",
        verdict:        report.verdict?.label  ?? "",
        archetype:      report.archetype?.name ?? "",
        dominantStyle:  report.dominantStyle   ?? "",
        breaches:       report.breaches?.length ?? 0,
        summary:        report.summary ?? "",
    };
    /* Add one column per OB theory score */
    (report.theories || []).forEach(t => { row["score_" + t.short] = t.score ?? ""; });

        await fetch(SHEETS_URL, {
            method:  "POST",
            mode:    "no-cors",          /* Apps Script doesn't need CORS preflight */
            headers: { "Content-Type": "application/json" },

        console.warn("Sheets sync failed (will retry is not supported — data is safe in localStorage):", err);
